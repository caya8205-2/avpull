name: Build and Release

on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os-label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-label: Windows
            artifact-name: avpull-windows
            avpull-bin: avpull.exe
            ffmpeg-bin: ffmpeg.exe
            ytdlp-bin: yt-dlp.exe
            innertube-bin: innertube.exe
            shell: pwsh
          - os: ubuntu-latest
            os-label: Linux
            artifact-name: avpull-linux
            avpull-bin: avpull-linux
            ffmpeg-bin: ffmpeg-linux
            ytdlp-bin: yt-dlp-linux
            innertube-bin: innertube-linux
            shell: bash
          - os: macos-latest
            os-label: macOS
            artifact-name: avpull-macos
            avpull-bin: avpull-macos
            ffmpeg-bin: ffmpeg-macos
            ytdlp-bin: yt-dlp-macos
            innertube-bin: innertube-macos
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Check if release exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh api "repos/${{ github.repository }}/releases/tags/v$version" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$version already exists. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$version not found. Will create."
          fi
      
      - name: Skip build if release exists
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Release already exists. Skipping build."

      - name: Build innertube-rs
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          git clone https://github.com/caya8205-2/innertube-rs.git /tmp/innertube-rs || git clone https://github.com/caya8205-2/innertube-rs.git innertube-rs-build
          cd /tmp/innertube-rs 2>/dev/null || cd innertube-rs-build
          cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/bin"
          if [ -f "target/release/innertube.exe" ]; then
            cp target/release/innertube.exe "$GITHUB_WORKSPACE/bin/innertube.exe"
          else
            cp target/release/innertube "$GITHUB_WORKSPACE/bin/innertube"
            chmod +x "$GITHUB_WORKSPACE/bin/innertube"
          fi
      
      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: bun install
      
      - name: Build binary
        if: steps.check_release.outputs.exists == 'false'
        run: bun build --compile --target=bun --outfile=dist/avpull ./bin/avpull.js
      
      - name: Copy dependencies to dist
        if: steps.check_release.outputs.exists == 'false'
        run: node scripts/copy-ffmpeg.js

      - name: Rename artifacts for release
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          cd dist
          # Rename avpull binary
          if [ -f "avpull.exe" ]; then
            echo "Windows binary, keeping as avpull.exe"
          elif [ -f "avpull" ]; then
            mv avpull "${{ matrix.avpull-bin }}"
            echo "Renamed avpull -> ${{ matrix.avpull-bin }}"
          fi

          # Rename ffmpeg binary
          if [ -f "ffmpeg.exe" ]; then
            echo "Windows ffmpeg, keeping as ffmpeg.exe"
          elif [ -f "ffmpeg" ]; then
            mv ffmpeg "${{ matrix.ffmpeg-bin }}"
            echo "Renamed ffmpeg -> ${{ matrix.ffmpeg-bin }}"
          fi

          # Rename yt-dlp binary
          if [ -f "yt-dlp.exe" ]; then
            echo "Windows yt-dlp, keeping as yt-dlp.exe"
          elif [ -f "yt-dlp" ]; then
            mv yt-dlp "${{ matrix.ytdlp-bin }}"
            echo "Renamed yt-dlp -> ${{ matrix.ytdlp-bin }}"
          fi

          # Rename innertube binary
          if [ -f "innertube.exe" ]; then
            echo "Windows innertube, keeping as innertube.exe"
          elif [ -f "innertube" ]; then
            mv innertube "${{ matrix.innertube-bin }}"
            echo "Renamed innertube -> ${{ matrix.innertube-bin }}"
          fi
      
      - name: Upload build artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run if at least one build ran (release doesn't exist yet)
    if: needs.build.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh api "repos/${{ github.repository }}/releases/tags/v$version" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Collect release files
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p release-upload
          # Copy all binaries from each platform artifact folder
          for dir in release-assets/*/; do
            cp "$dir"* release-upload/ 2>/dev/null || true
          done
          echo "Release files:"
          ls -la release-upload/

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            release-upload/* \
            --title "v$version" \
            --generate-notes

      - name: Trigger npm publish
        if: steps.check_release.outputs.exists == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: release-created
          client-payload: '{"version": "v${{ steps.version.outputs.version }}"}'
