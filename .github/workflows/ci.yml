name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build innertube-rs
        shell: bash
        run: |
          git clone https://github.com/caya8205-2/innertube-rs.git /tmp/innertube-rs || git clone https://github.com/caya8205-2/innertube-rs.git innertube-rs-build
          cd /tmp/innertube-rs 2>/dev/null || cd innertube-rs-build
          cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/bin"
          if [ -f "target/release/innertube.exe" ]; then
            cp target/release/innertube.exe "$GITHUB_WORKSPACE/bin/innertube.exe"
          else
            cp target/release/innertube "$GITHUB_WORKSPACE/bin/innertube"
            chmod +x "$GITHUB_WORKSPACE/bin/innertube"
          fi

      - run: bun install

      - name: Build binary
        run: bun run build

      - name: Copy ffmpeg
        run: node scripts/copy-ffmpeg.js

      - name: Verify artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/avpull.exe || exit 1
            test -f dist/ffmpeg.exe || exit 1
            test -f dist/yt-dlp.exe || exit 1
            test -f dist/innertube.exe || exit 1
          else
            test -f dist/avpull || exit 1
            test -f dist/ffmpeg || exit 1
            test -f dist/yt-dlp || exit 1
            test -f dist/innertube || exit 1
          fi
          echo "All artifacts verified."

      - uses: actions/upload-artifact@v4
        with:
          name: avpull-${{ runner.os }}
          path: dist/
