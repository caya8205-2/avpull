name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install

      - name: Build binary
        run: bun run build

      - name: Copy ffmpeg
        run: node scripts/copy-ffmpeg.js

      - name: Verify artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/avpull.exe || exit 1
            test -f dist/ffmpeg.exe || exit 1
            test -f dist/yt-dlp.exe || exit 1
          else
            test -f dist/avpull || exit 1
            test -f dist/ffmpeg || exit 1
            test -f dist/yt-dlp || exit 1
          fi
          echo "All artifacts verified."

      - uses: actions/upload-artifact@v4
        with:
          name: avpull-${{ runner.os }}
          path: dist/
